# What the shared QA scripts in dot-game/tools need to know about this game (sourced by perf_budget.sh, visual_check.sh).
# One perf case: the client bench has no map switch, so bhop_g2g_intro is the real client against the real timer server and module.
PERF_CASES=bhop_g2g_intro
PERF_SECONDS=20

perf_run_case() {
    GPU_TIMEOUT=300 timeout -k 10 360 ../gpu.sh run "$GAME" res://tools/client_bench.tscn -- \
        --delay 20 --play --seconds "$2" --json
}

# A case is an imported map id; tools/bsp_preview.sh leaves screenshots/<id>_spawn_<n>.png (four angles, we compare two).
VISUAL_CASES="bhop_g2g_intro"
VISUAL_SHOTS="spawn_0 spawn_2"

visual_render() { heavy -- timeout 600 tools/bsp_preview.sh "$1" spawn 4; }
